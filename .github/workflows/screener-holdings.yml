# Weekly TDCC (集保結算所) equity distribution refresh.
# TDCC publishes the weekly shareholder distribution (1-999 shares up to >1000張大戶)
# every Friday evening (usually between 19:30 and 21:30 Taipei time).
#
# This standalone workflow ingests the newest Friday report, updates the rolling
# 3-year holdings history in R2, and leaves the daily ETL to join `retailPct`
# and `bigHolderPct` directly from R2.

name: Screener Holdings (Weekly TDCC)

on:
  schedule:
    # Friday 21:45 Taipei — primary weekly run (published by 21:30 on normal weeks).
    - cron: '45 21 * * 5'
      timezone: 'Asia/Taipei'
    # Saturday 09:15 Taipei — catch-up guard (in case TDCC delayed publication on Friday).
    # If Friday already succeeded, the internal freshness gate skips rewriting.
    - cron: '15 9 * * 6'
      timezone: 'Asia/Taipei'
  workflow_dispatch:
    inputs:
      force:
        description: Force rewrite the holdings dataset even if already current
        type: boolean
        default: false

concurrency:
  group: screener-holdings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: screener
    steps:
      - uses: actions/checkout@v7

      - name: Trigger
        run: |
          echo "event=${{ github.event_name }} schedule='${{ github.event.schedule }}'"
          date -u '+started %Y-%m-%dT%H:%M:%SZ (UTC)'
          TZ=Asia/Taipei date '+started %Y-%m-%d %H:%M:%S (Taipei)'

      - name: Check R2 secrets
        run: |
          for k in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            if [ -z "${!k}" ]; then
              echo "::error::repository secret $k is missing"
              exit 1
            fi
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Fetch and upload TDCC Holdings
        run: |
          force=''
          if [ "${{ inputs.force }}" = 'true' ]; then
            force='--force'
          fi
          echo "Running holdings ETL $force..."
          bun holdings.ts $force

      - name: Verify holdings in R2
        timeout-minutes: 5
        run: bun verify.ts
