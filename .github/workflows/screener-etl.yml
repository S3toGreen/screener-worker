# The screener's daily data refresh (Mon–Fri, plus the 03:45 Taipei guard that
# runs Tue–Sat). The slots below are the active trigger; an external dispatcher
# (e.g. a Cloudflare cron Worker the operator owns) can instead POST
# `workflow_dispatch` with `phase: early` on the evening runs and `force: true`
# on the guard — the run itself is identical either way.
#
# Why GitHub Actions and not the Worker's own cron: the account is on the
# Workers Free plan (50 subrequests / 10 ms CPU per invocation, and `limits` is
# rejected there), while one ETL run makes ~4 000 R2 operations. The Pages
# function stays a free read-only CDN; this job runs the SAME `runEtl` from
# `src/etl.ts`, reads the PREVIOUS objects straight from
# R2 through the S3 API and pushes the new ones the same way (`seedFs.ts`).
#
# Required repository secrets:
#   R2_ACCESS_KEY_ID     — an R2 API token's Access Key ID (Dashboard → R2 →
#   R2_SECRET_ACCESS_KEY   Manage R2 API Tokens → Object Read & Write)
#   R2_ENDPOINT          — https://<account id>.r2.cloudflarestorage.com
#
# A Worker can TRIGGER this workflow (one subrequest); it cannot RUN the ETL —
# a Free invocation is 50 subrequests / 10 ms CPU.

name: Screener ETL

on:
  schedule:
    # GitHub Actions runs cron in UTC; `timezone:` is NOT applied.
    # 18:15 Taipei = 10:15 UTC, Mon–Fri.
    - cron: '15 10 * * 1-5'
    # 21:15 Taipei = 13:15 UTC, Mon–Fri (the evening repair pass).
    - cron: '15 13 * * 1-5'
    # 03:45 Taipei, Tue–Sat = 19:45 UTC, Mon–Fri. The GUARD runs FORCED.
    - cron: '45 19 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: Rewrite the current session even if R2 already holds it
        type: boolean
        default: false
      phase:
        description: >-
          early = a partial is only a warning (a later run repairs it).
          Leave empty for a strict run (the default).
        type: string
        default: ''

concurrency:
  group: screener-etl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: screener
    steps:
      - uses: actions/checkout@v7

      - name: Trigger
        run: |
          echo "event=${{ github.event_name }} schedule='${{ github.event.schedule }}'"
          date -u '+started %Y-%m-%dT%H:%M:%SZ (UTC)'
          TZ=Asia/Taipei date '+started %Y-%m-%d %H:%M:%S (Taipei)'

      - name: Check the R2 secrets
        run: |
          for k in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            if [ -z "${!k}" ]; then
              echo "::error::repository secret $k is missing — the ETL cannot read or upload R2"
              exit 1
            fi
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test src

      - name: Fill missing histories (safety guard)
        id: safety
        timeout-minutes: 35
        run: bun safety.ts --repair

      - name: Run the ETL and upload to R2
        id: seed
        timeout-minutes: 20
        run: |
          set +e
          force=''
          # The 21:15 evening pass and the 03:45 guard are forced same-session
          # rewrites: a late 當沖/margin/SBL table must actually be repaired,
          # not skipped by the freshness gate. GitHub emits the UTC crons.
          if [ "${{ inputs.force }}" = 'true' ] || [ "${{ github.event.schedule }}" = '45 19 * * 1-5' ] || [ "${{ github.event.schedule }}" = '15 13 * * 1-5' ]; then
            force='--force'
          fi
          # A safety repair changed a history. Rebuild the snapshot even on holidays.
          if [ "${{ steps.safety.outputs.repaired }}" = 'true' ]; then
            force='--force'
          fi
          echo "seed $force"
          bun seed.ts $force
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Smoke the local publish
        if: steps.seed.outputs.code == '0' || steps.seed.outputs.code == '3'
        run: |
          if [ -f .seed-out/screener-latest.json ]; then
            bun run smoke
          else
            echo 'no local snapshot — no publication to smoke'
          fi

      - name: Verify the served data
        if: steps.seed.outputs.code == '0' || steps.seed.outputs.code == '3'
        timeout-minutes: 5
        run: bun verify.ts

      - name: Fail unless the run was complete
        if: always()
        run: |
          seed='${{ steps.seed.outputs.code }}'
          sched='${{ github.event.schedule }}'
          phase='${{ inputs.phase }}'

          if [ "$seed" = '0' ]; then
            echo 'ETL complete (all tables published).'
            exit 0
          fi

          # GitHub emits the UTC crons for 18:15/21:15 Taipei.
          early_schedule=''
          case "$sched" in
            '15 10 * * 1-5' | '15 13 * * 1-5') early_schedule=1 ;;
          esac

          # A PARTIAL run (seed=3) is a warning ONLY where a later repair is
          # guaranteed: the 18:15/21:15 schedule slots, or an explicit
          # `phase: early` dispatch. A plain manual dispatch is STRICT — a
          # partial market object must never be laundered green.
          if [ "$seed" = '3' ] && { [ "$early_schedule" = '1' ] || [ "$phase" = 'early' ]; }; then
            echo "::warning::ETL partial (seed=3) — late tables (margin/SBL) pending. The later slot/guard will repair them."
            exit 0
          fi

          echo "ETL FAILED: seed=${seed:-not-run} schedule=${sched:-none}" >&2
          exit 1
